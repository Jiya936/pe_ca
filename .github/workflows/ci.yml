name: CI Pipeline for Titanic ML API

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Smoke Test on Model Artifacts
      run: |
        python -c "import joblib; model = joblib.load('titanic_model.pkl'); scaler = joblib.load('scaler.pkl'); print('Model artifacts loaded successfully in CI!')"

    - name: Build Docker Image
      run: |
        docker build -t titanic-kaggle-api:latest .